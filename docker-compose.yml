services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dropkart
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dropkart"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dropkart
      ADMIN_TOKEN: dev-admin-token
      WEBHOOK_SECRET: local-only-webhook-secret-change-me
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
